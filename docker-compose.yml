name: ynobuild

# Services
#   api  — long-running, owns the SQLite DB on the `dbdata` volume
#   web  — long-running Streamlit UI, talks to api over HTTP
#   ingest / fetch / splits — one-shot batch jobs (profile: jobs).
#     Run with:  docker compose run --rm <job> [args]
#     They mount the same db volume; run them while api is idle (single writer).

services:

  api:
    build:
      context: .
      target: api
    environment:
      YNB_DB_PATH: /data/ynobuild.db
      YNB_TAXONOMY_PATH: /app/taxonomy/taxonomy_map.yaml
    volumes:
      - dbdata:/data
      - ./taxonomy:/app/taxonomy:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    environment:
      YNB_API_URL: http://api:8000
      YNB_ANNOTATOR: ${YNB_ANNOTATOR:-vp}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---- batch jobs (docker compose run --rm <name>) --------------------------
  ingest:
    build: { context: ., target: core }
    profiles: ["jobs"]
    environment:
      YNB_DB_PATH: /data/ynobuild.db
      YNB_TAXONOMY_PATH: /app/taxonomy/taxonomy_map.yaml
      YNB_LOG_MAX_BYTES: ${YNB_LOG_MAX_BYTES:-262144}
    volumes:
      - dbdata:/data
      - ./taxonomy:/app/taxonomy:ro
      - ./data:/data-in:ro
    command: ["load-csv", "/data-in/builds.csv"]

  fetch:
    build: { context: ., target: core }
    profiles: ["jobs"]
    environment:
      YNB_DB_PATH: /data/ynobuild.db
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - dbdata:/data
      - ./taxonomy:/app/taxonomy:ro
    command: ["fetch-dockerfiles"]

  splits:
    build: { context: ., target: core }
    profiles: ["jobs"]
    environment:
      YNB_DB_PATH: /data/ynobuild.db
    volumes:
      - dbdata:/data
      - ./taxonomy:/app/taxonomy:ro
    command: ["assign-splits", "--seed", "7400"]

volumes:
  dbdata:
