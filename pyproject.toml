[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ynbtriage"
version = "0.1.0"
description = "ynobuild — container build-failure triage: corpus tooling, data-access API, and CLI"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VP Nagraj" }]
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "pandas>=2",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
# Modeling. For a CPU-only torch (much smaller), install torch first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
model = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "sentence-transformers>=3",
]

[project.scripts]
ynbtriage = "ynbtriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ynbtriage = ["schema.sql"]
